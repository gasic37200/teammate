<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직군에 맞는 AI의 평가를 받아보세요!</title>
    <link rel="stylesheet" href="/css/feedback-widget.css">
</head>
<body>
<main>
    <h1>AI 역량 평가</h1>

    <form id="gradingForm">
        <section>
            <label>
                <input type="radio" name="role" value="developer" checked>
                개발자
            </label>

            <label>
                <input type="radio" name="role" value="designer">
                디자이너
            </label>

            <label>
                <input type="radio" name="role" value="planner">
                기획자
            </label>
        </section>

        <section id="inputArea">
            <!-- JS에서 직군별 입력 필드 렌더링 -->
        </section>

        <button type="submit">평가 받기</button>
    </form>
</main>
<div id="resultArea"></div>

<button id="feedbackButton" type="button" class="feedback-button">피드백 남기기</button>

<script src="/js/index.js"></script>
<script>
    window.FeedbackWidgetConfig = {
        endpoint: '/api/feedback',
        buttonSelector: '#feedbackButton',
        storageKey: 'feedback-client-id:teammate'
    };
</script>
<script src="/js/feedback-widget.js"></script>
</body>
</html>
